<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/__sdk/dd-base.css" />
    <link rel="stylesheet" href="deck.css" />
  </head>
  <body>
    <dd-panel id="deck" class="deck">
      <nav class="tabs" id="tabs" role="tablist">
        <button class="tab" data-tab="np" role="tab" aria-selected="true">Now playing</button>
        <button class="tab" data-tab="sys" role="tab">System</button>
        <button class="tab" data-tab="drives" role="tab">Drives</button>
        <button class="tab" data-tab="net" role="tab">Network</button>
        <button class="tab" data-tab="weather" role="tab">Weather</button>
      </nav>

      <!-- Now playing -->
      <section class="page np-page" id="page-np" data-page="np">
        <div class="deck__art-box">
          <img class="deck__art" data-bind="art" alt="" />
          <dd-icon class="deck__fallback" src="note.svg" tint data-bind="fallback"></dd-icon>
        </div>
        <div class="np-main">
          <div class="deck__track">
            <div class="deck__marquee"><dd-text class="deck__title" variant="title" data-bind="title"></dd-text></div>
            <dd-text class="deck__artist" variant="muted" size="sm" data-bind="artist"></dd-text>
            <dd-text class="deck__album" variant="muted" size="xs" data-bind="album"></dd-text>
          </div>
          <div class="deck__seek" data-bind="seekRow">
            <span class="deck__time" data-bind="elapsed"></span>
            <input type="range" class="dd-slider" id="seek" min="0" max="100" step="1" value="0" />
            <span class="deck__time" data-bind="total"></span>
          </div>
          <div class="deck__transport">
            <dd-icon-button round id="prevBtn" name="skip-back" title="Previous"></dd-icon-button>
            <dd-icon-button round id="playBtn" name="play" title="Play"></dd-icon-button>
            <dd-icon-button round id="nextBtn" name="skip-forward" title="Next"></dd-icon-button>
          </div>
          <!-- The volume pill owns its own mute speaker + % — no extra icon. -->
          <div class="deck__sound" id="sound"></div>
          <p class="dd-empty deck__empty">Nothing playing</p>
        </div>
      </section>

      <!-- System -->
      <section class="page" id="page-sys" data-page="sys" hidden>
        <div class="deck__meters" id="meters">
          <div class="deck__meter" data-bind="row-cpu"><span class="deck__meter-label">CPU</span><dd-meter data-bind="meter-cpu"></dd-meter><span class="deck__meter-value" data-bind="value-cpu"></span></div>
          <div class="deck__meter" data-bind="row-ram"><span class="deck__meter-label">RAM</span><dd-meter data-bind="meter-ram"></dd-meter><span class="deck__meter-value" data-bind="value-ram"></span></div>
          <div class="deck__meter" data-bind="row-gpu"><span class="deck__meter-label">GPU</span><dd-meter data-bind="meter-gpu"></dd-meter><span class="deck__meter-value" data-bind="value-gpu"></span></div>
          <div class="deck__meter" data-bind="row-battery"><span class="deck__meter-label">Battery</span><dd-meter data-bind="meter-battery"></dd-meter><span class="deck__meter-value" data-bind="value-battery"></span></div>
        </div>
        <div class="deck__chips" id="chips"></div>
      </section>

      <!-- Drives -->
      <section class="page drives-page" id="page-drives" data-page="drives" hidden>
        <div class="drives" id="drives"></div>
      </section>

      <!-- Network -->
      <section class="page net-page" id="page-net" data-page="net" hidden>
        <div class="net-graph-box"><canvas id="net-graph" class="net-graph"></canvas></div>
        <div class="net-legend">
          <span class="lg down"><i>Download</i><b id="net-down">–</b></span>
          <span class="lg up"><i>Upload</i><b id="net-up">–</b></span>
          <span class="lg tot"><i>This session</i><b id="net-total">0</b></span>
        </div>
      </section>

      <!-- Weather -->
      <section class="page weather-page" id="page-weather" data-page="weather" hidden>
        <div class="wx-now" id="wx-now" hidden>
          <span class="wx-glyph" id="wx-glyph">–</span>
          <div class="wx-main">
            <div class="wx-temp" id="wx-temp">–°</div>
            <div class="wx-desc" id="wx-desc">—</div>
            <div class="wx-place" id="wx-place"></div>
          </div>
        </div>
        <div class="wx-forecast" id="wx-forecast"></div>
        <p class="dd-empty wx-empty" id="wx-empty" hidden>Set a Weather location in the taskbar settings.</p>
      </section>
      <!-- Tools & Power sheet (opened by the dock's Tools button) -->
      <section class="page menu-page" id="page-menu" data-page="menu" hidden>
        <div class="menu-head">Tools</div>
        <button class="menu-item" data-app="task">Task Manager</button>
        <button class="menu-item" data-app="terminal">Terminal</button>
        <button class="menu-item" id="menu-explorer">File Explorer</button>
        <button class="menu-item" data-app="settings">Windows Settings</button>
        <button class="menu-item" data-app="control">Control Panel</button>
        <div class="menu-sep"></div>
        <button class="menu-item" id="menu-start">Start menu</button>
        <button class="menu-item" id="menu-taskbar">Taskbar settings…</button>
        <div class="menu-sep"></div>
        <div class="menu-head">Power</div>
        <div class="menu-power">
          <button class="menu-pw" data-power="lock">Lock</button>
          <button class="menu-pw" data-power="signOut">Sign out</button>
          <button class="menu-pw" data-power="sleep">Sleep</button>
          <button class="menu-pw" data-power="restart">Restart</button>
          <button class="menu-pw danger" data-power="shutdown">Shut down</button>
        </div>
      </section>
    </dd-panel>
    <script src="/__sdk/widget-sdk.js"></script>
    <script src="deck.js"></script>
  </body>
</html>
