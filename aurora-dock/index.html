<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/__sdk/dd-base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- One full-width dd-bar segment: the glass (56u) plus 20u of reach so a
         magnified icon and the risen now-playing chip stay hoverable. The rest
         of the 128u window is transparent headroom and clicks through. -->
    <dd-bar id="bar" place="fill" reach="20">
      <dd-panel id="glass" bare>
        <!-- Aurora's living light field. Painted by widget.js. -->
        <canvas id="field" class="field" aria-hidden="true"></canvas>

        <div class="zone zone--left">
          <!-- Real Windows Start (host component). Label is editable. -->
          <dd-bar-button id="start" class="mag" action="start" label="Start"></dd-bar-button>
          <!-- App launcher: opens the deck's Launcher tab. -->
          <dd-bar-button id="launcher" class="mag" action="pane" pane-w="560" pane-h="380"
            label="Apps" hidden>
            <dd-icon class="launcher__ico" src="grid.svg" tint></dd-icon>
          </dd-bar-button>
          <!-- Clock: markup shape, readouts bound in widget.js; click cycles faces. -->
          <button class="clock" id="clock" type="button" aria-label="Clock">
            <span class="clock__text">
              <span class="clock__time" data-bind="time"></span>
              <span class="clock__date" data-bind="date"></span>
            </span>
            <canvas class="clock__face" id="clock-face" width="120" height="120" hidden></canvas>
          </button>
        </div>

        <!-- Host app strip: launches, previews, pins, lifecycle are its. -->
        <dd-apps id="apps" settings="pins" indicator="dots" stagger="40" sortable></dd-apps>

        <div class="zone zone--right">
          <!-- Now-playing chip → opens the deck (control centre). -->
          <dd-bar-button id="deck" class="mag" action="pane" pane-w="560" pane-h="360" label="Now playing">
            <span class="np" id="np">
              <span class="np__art-box">
                <img class="np__art" data-bind="art" alt="" />
                <dd-icon class="np__fallback" src="note.svg" tint data-bind="fallback"></dd-icon>
              </span>
              <span class="np__text">
                <span class="np__title" data-bind="title"></span>
                <span class="np__artist" data-bind="artist"></span>
              </span>
            </span>
          </dd-bar-button>

          <!-- Vitals as number percents (not rings). Opens the deck too. -->
          <button class="vitals" id="vitals" type="button" aria-label="System">
            <span class="vnum" data-bind="v-cpu"><b class="vnum__v" data-bind="cpu">–</b><i class="vnum__l">CPU</i></span>
            <span class="vnum" data-bind="v-ram"><b class="vnum__v" data-bind="ram">–</b><i class="vnum__l">RAM</i></span>
            <span class="vnum" data-bind="v-gpu"><b class="vnum__v" data-bind="gpu">–</b><i class="vnum__l">GPU</i></span>
            <span class="vnum vnum--net" data-bind="v-net"><b class="vnum__v" data-bind="net">–</b><i class="vnum__l">NET</i></span>
          </button>

          <!-- System tray: component owns its visibility and the list. -->
          <dd-tray-caret class="tray" settings="systray" separator hidden></dd-tray-caret>
        </div>

        <!-- Notification badges float over the app strip (positioned in JS). -->
        <div class="badges" id="badges" aria-hidden="true"></div>
      </dd-panel>
    </dd-bar>

    <script src="/__sdk/widget-sdk.js"></script>
    <script src="widget.js"></script>
  </body>
</html>
